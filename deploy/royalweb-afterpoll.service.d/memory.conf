# 2026-10-19: cap the after-poll steps (duel index, duel model, ... ~4.4 GB
# seen) so they slow down (MemoryHigh) or fail alone (MemoryMax) instead of
# pushing the machine into a global OOM, and make them the kernel first
# choice if one happens anyway. A failed step is retried after the next poll.
# Remove this file to undo.
[Service]
MemoryHigh=6G
MemoryMax=7G
OOMScoreAdjust=500
